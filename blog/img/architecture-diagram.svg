<svg width="100%" viewBox="0 0 680 454" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
<title>Diagrama de arquitectura</title>
<desc>El navegador llama a api/, que delega en domain/, que usa persistence/ (Postgres) y agents/ (Gemini/ADK) como adaptadores de salida. core/ es plomería transversal usada por todas las capas.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#14120d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="250" y1="96" x2="250" y2="144" stroke="#14120d" stroke-opacity="0.55" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="250" y1="202" x2="250" y2="250" stroke="#14120d" stroke-opacity="0.55" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="250" y1="308" x2="150" y2="356" stroke="#14120d" stroke-opacity="0.55" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="250" y1="308" x2="350" y2="356" stroke="#14120d" stroke-opacity="0.55" stroke-width="1.2" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="40" width="380" height="56" rx="8" fill="#FFFFFF" stroke="#14120d" stroke-opacity="0.35" stroke-width="1"/>
<text x="250" y="59" text-anchor="middle" font-size="14" font-weight="600" fill="#14120d">Navegador</text>
<text x="250" y="79" text-anchor="middle" font-size="12" fill="#14120d" fill-opacity="0.55">fetch + EventSource</text>
</g>

<g>
<rect x="60" y="146" width="380" height="56" rx="8" fill="#EFEFE9" stroke="#14120d" stroke-opacity="0.35" stroke-width="1"/>
<text x="250" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#14120d">api/</text>
<text x="250" y="185" text-anchor="middle" font-size="12" fill="#14120d" fill-opacity="0.55">Entrada · HTTP delgado</text>
</g>

<g>
<rect x="60" y="252" width="380" height="56" rx="8" fill="#FBEAF3" stroke="#E0399C" stroke-width="1"/>
<text x="250" y="271" text-anchor="middle" font-size="14" font-weight="600" fill="#14120d">domain/</text>
<text x="250" y="291" text-anchor="middle" font-size="12" fill="#14120d" fill-opacity="0.6">Núcleo de negocio</text>
</g>

<g>
<rect x="60" y="358" width="180" height="56" rx="8" fill="#EFEFE9" stroke="#14120d" stroke-opacity="0.35" stroke-width="1"/>
<text x="150" y="377" text-anchor="middle" font-size="14" font-weight="600" fill="#14120d">persistence/</text>
<text x="150" y="397" text-anchor="middle" font-size="12" fill="#14120d" fill-opacity="0.55">Postgres · repos</text>
</g>

<g>
<rect x="260" y="358" width="180" height="56" rx="8" fill="#FCF3E0" stroke="#C9A054" stroke-width="1"/>
<text x="350" y="377" text-anchor="middle" font-size="14" font-weight="600" fill="#14120d">agents/</text>
<text x="350" y="397" text-anchor="middle" font-size="12" fill="#14120d" fill-opacity="0.6">Gemini/ADK · LLM</text>
</g>

<g>
<rect x="468" y="146" width="168" height="268" rx="16" fill="#FFFFFF" stroke="#14120d" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 3"/>
<text x="552" y="177" text-anchor="middle" font-size="14" font-weight="600" fill="#14120d">core/</text>
<text x="552" y="197" text-anchor="middle" font-size="12" fill="#14120d" fill-opacity="0.55">plomería común</text>
<text x="552" y="231" text-anchor="middle" font-size="12" fill="#14120d" fill-opacity="0.7">settings</text>
<text x="552" y="255" text-anchor="middle" font-size="12" fill="#14120d" fill-opacity="0.7">database</text>
<text x="552" y="279" text-anchor="middle" font-size="12" fill="#14120d" fill-opacity="0.7">logging</text>
<text x="552" y="303" text-anchor="middle" font-size="12" fill="#14120d" fill-opacity="0.7">auth</text>
</g>
</svg>
